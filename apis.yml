aid: openstore
name: OpenStore
description: >-
  OpenStore (Miami Labs, Inc. d/b/a OpenStore) is a Miami-based e-commerce
  holding company that buys direct-to-consumer Shopify businesses from their
  founders, offering data-driven valuations, offers in as little as 24 hours,
  and closings in about a week. After acquiring long-tail Shopify merchants,
  OpenStore uses its own software, marketing, and operations platform to run
  and grow the brands under one portfolio. Founded in 2021 by Keith Rabois and
  Atomic's Jack Abraham, OpenStore is backed by General Catalyst, Founders
  Fund, Atomic, Khosla Ventures, and others. It is a consumer/operator
  business and does not publish a public developer API, SDK, or developer
  portal; this profile captures its corporate and web-property surface.
